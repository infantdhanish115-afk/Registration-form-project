<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <!--tailwind cdn link-->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--my script page-->
    <script src="script.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-xl p-8 w-96 max-md:">
        <h2 class="text-2xl font-bold text-center text-blue-700 mb-6">Registration Form</h2>
        <form class="space-y-4" id="registrationform">

            <!--1.full name-->
            <div>
                <label class="block text-sm font-semibold mb-1">Full Name</label>
                <input id="fullname" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" type="text" placeholder="Enter your Name">
            </div>

            <!--2.Email-->
            <div>
                <label class="block text-sm font-semibold mb-1">E-mail</label>
                <input id="email" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" type="email" placeholder="Mail____@.com">
            </div>

            <!--3.password-->
            <div>
                <label class="block text-sm font-semibold mb-1">Password</label>
                <input id="password" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" type="password" placeholder="Enter your Password">
            </div>

            <!--4.confirm password-->
            <div>
                <label class="block text-sm font-semibold mb-1">Confirm Password</label>
                <input id="conform_password" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" type="password" placeholder="Enter Correct Password">
            </div>

            <!--5.gender-->
            <div>
                <label>Gender</label>
                <select id="gender" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Select</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!--6.phone number-->
            <div>
                <label class="block text-sm font-semibold mb-1">Phone Number</label>
                <input id="phone" class="w-full border rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" type="number" placeholder="Enter Phone Number">
            </div>

            <!--7.checkbox-->
            <div class="flex items-center space-x-2">
                <input id="check" class="to-blue-600" type="checkbox">
                <label class="text-sm">i agree to the terms & condition</label>
            </div>

            <!--8.register button-->
            <button class="w-full bg-blue-600 text-white py-2 rounded-md font-semibold hover:bg-blue-700">Register</button>

            <p id="message" class="text-center mt-3 text-sm font-medium"></p>
        </form>
    </div>
    
</body>
</html>
